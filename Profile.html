<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Cyber Profile Title -->
<title>My Cyber Profile | Cybersecurity • ICT • Security Management</title>

<!-- Cyber Profile GIF Icon Suite -->
<link rel="icon" type="image/gif" href="profile.gif">
<link rel="shortcut icon" type="image/gif" href="profile.gif">
<link rel="apple-touch-icon" href="profile.gif">


<style>

:root {

    --bg-color:#050914;
    --primary:#00d9ff;
    --secondary:#2563eb;
    --accent:#00ff99;

    --text-main:#ffffff;
    --text-muted:#9ca9bd;

    --glow:rgba(0,217,255,.20);
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;

    background:
    radial-gradient(circle at top left,
    rgba(0,217,255,.15),
    transparent 40%),

    radial-gradient(circle at bottom right,
    rgba(37,99,235,.15),
    transparent 45%),

    var(--bg-color);


    font-family:
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

    -webkit-font-smoothing:antialiased;

}



/* Cyber Background Animation */

.bg-glow{

    position:absolute;

    width:600px;
    height:600px;

    background:
    radial-gradient(
        circle,
        var(--glow),
        transparent 70%
    );


    top:-200px;
    left:-200px;

    animation:
    cyberFloat 12s infinite alternate ease-in-out;

    pointer-events:none;

}



/* Loader */

#loader{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;


    background:#050914;

    z-index:9999;


    transition:
    opacity .7s ease,
    visibility .7s ease;

}




/* Logo */

.logo-wrapper{


    width:120px;
    height:120px;


    display:flex;

    justify-content:center;
    align-items:center;


    border-radius:50%;


    background:
    rgba(255,255,255,.03);


    border:

    1px solid
    rgba(0,217,255,.35);


    box-shadow:

    0 0 35px rgba(0,217,255,.45),

    inset 0 0 25px rgba(0,217,255,.15);


    animation:

    logoPulse 3s infinite ease-in-out;

}



.logo-wrapper img{


    width:85px;

    height:85px;

    object-fit:contain;


    filter:

    drop-shadow(
    0 0 20px
    rgba(0,217,255,.8)
    );

}




/* Text */


.entrance-text{


    margin-top:30px;


    color:var(--text-main);


    font-size:32px;


    font-weight:700;


    letter-spacing:.5px;


    text-align:center;

}



.subtitle-text{


    margin-top:12px;


    color:var(--text-muted);


    font-size:14px;


    letter-spacing:3px;


    text-transform:uppercase;


    text-align:center;

}



/* Loading Bar */


.progress-container{


    width:280px;

    height:5px;


    margin-top:40px;


    overflow:hidden;


    border-radius:20px;


    background:
    rgba(255,255,255,.08);

}



.progress-bar{


    width:100%;

    height:100%;


    background:

    linear-gradient(
        90deg,
        #00d9ff,
        #2563eb,
        #00ff99
    );


    box-shadow:

    0 0 20px #00d9ff;


    animation:

    loading 2.5s infinite;

}



/* Application Frame */


iframe{


    width:100%;

    height:100%;


    border:none;


    display:block;


    opacity:0;


    transform:

    scale(1.02);


    filter:blur(5px);


    transition:

    all .8s ease;

}



iframe.loaded{


    opacity:1;


    transform:

    scale(1);


    filter:none;

}




.fade-out{


    opacity:0!important;


    visibility:hidden!important;


}



/* Animations */


@keyframes loading{


    0%{
        transform:translateX(-100%);
    }


    50%{
        transform:translateX(-20%);
    }


    100%{
        transform:translateX(100%);
    }

}



@keyframes cyberFloat{


    from{

        transform:
        translate(0,0)
        scale(1);

    }


    to{

        transform:
        translate(50px,40px)
        scale(1.2);

    }

}



@keyframes logoPulse{


    0%,100%{

        transform:
        scale(1);

    }


    50%{

        transform:
        scale(1.08);

    }

}


</style>

</head>


<body>


<!-- Cyber Background -->
<div class="bg-glow"></div>



<!-- Cyber Profile Loader -->

<div id="loader">


    <div class="logo-wrapper">


        <img
        src="profile.gif"
        alt="Cyber Profile Logo">


    </div>



    <h1 class="entrance-text">

        My Cyber Profile

    </h1>



    <p class="subtitle-text">

        Cybersecurity • ICT • Security Management

    </p>




    <div class="progress-container">

        <div class="progress-bar"></div>

    </div>


</div>




<!-- Main Cyber Profile Application -->

<iframe

id="app-frame"


src="https://script.google.com/macros/s/AKfycbw5wBPimm2ulyNWfh-eZCCQzH4T7gabIPuKTSBbkdiVnbIKfMp5T_QVnRHaZJe-8lAJ/exec"


allow="camera; microphone; geolocation; clipboard-write"


sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">

</iframe>




<script>


const iframe =
document.getElementById("app-frame");


const loader =
document.getElementById("loader");



let appLoaded=false;



function initializeApp(){


    if(appLoaded)
    return;



    appLoaded=true;


    iframe.classList.add("loaded");


    loader.classList.add("fade-out");


}




// Normal Load

iframe.addEventListener(
"load",
initializeApp
);



// Backup Loading Timeout

setTimeout(
initializeApp,
3500
);



</script>



</body>
</html>
