<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cyber Profile | Security • Technology • Innovation</title>

<link rel="icon" type="image/png" href="cyber.png">
<link rel="shortcut icon" href="cyber.png">
<link rel="apple-touch-icon" href="cyber.png">

<style>
:root{
    --bg:#05080d;
    --surface:#0b1220;
    --primary:#00d4ff;
    --secondary:#2563eb;
    --accent:#00ff9d;
    --text:#ffffff;
    --muted:#9caec9;
    --glow:rgba(0,212,255,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* Background */

body{
    background:
        radial-gradient(circle at top left, rgba(0,212,255,.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(37,99,235,.10), transparent 45%),
        linear-gradient(135deg,#04070c,#07121d,#04070c);
}

.bg-glow{
    position:absolute;
    width:650px;
    height:650px;
    background:radial-gradient(circle,var(--glow) 0%,transparent 70%);
    top:-180px;
    left:-180px;
    animation:floatGlow 12s ease-in-out infinite alternate;
}

/* Loader */

#loader{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:var(--bg);
    z-index:9999;
    transition:.7s;
}

.logo-wrapper{
    width:110px;
    height:110px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(0,212,255,.3);
    box-shadow:
        0 0 20px rgba(0,212,255,.25),
        inset 0 0 20px rgba(0,212,255,.08);
    animation:logoFloat 2.5s ease-in-out infinite;
}

.logo-wrapper img{
    width:75px;
    filter:drop-shadow(0 0 18px rgba(0,212,255,.6));
}

.entrance-text{
    margin-top:28px;
    font-size:34px;
    font-weight:700;
    letter-spacing:.5px;
}

.subtitle-text{
    margin-top:10px;
    color:var(--muted);
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* Progress */

.progress-container{
    width:260px;
    height:5px;
    background:rgba(255,255,255,.06);
    border-radius:30px;
    overflow:hidden;
    margin-top:40px;
}

.progress-bar{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #00d4ff,
        #2563eb,
        #00ff9d
    );
    box-shadow:0 0 18px #00d4ff;
    animation:loading 2.4s infinite;
}

/* Frame */

iframe{
    width:100%;
    height:100%;
    border:none;
    opacity:0;
    transform:scale(1.02);
    filter:blur(6px);
    transition:.8s;
}

iframe.loaded{
    opacity:1;
    transform:scale(1);
    filter:none;
}

.fade-out{
    opacity:0!important;
    visibility:hidden!important;
}

/* Animations */

@keyframes loading{
    0%{transform:translateX(-100%);}
    50%{transform:translateX(-15%);}
    100%{transform:translateX(100%);}
}

@keyframes floatGlow{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(40px,35px) scale(1.15);
    }
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div id="loader">

    <div class="logo-wrapper">
        <img src="cyber.png" alt="My Cyber Profile">
    </div>

    <h1 class="entrance-text">
        My Cyber Profile
    </h1>

    <p class="subtitle-text">
        Security • Technology • Innovation
    </p>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</div>

<iframe
id="app-frame"
src="https://script.google.com/macros/s/AKfycbw5wBPimm2ulyNWfh-eZCCQzH4T7gabIPuKTSBbkdiVnbIKfMp5T_QVnRHaZJe-8lAJ/exec"
allow="camera; microphone; geolocation; clipboard-write"
sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
</iframe>

<script>
const iframe=document.getElementById("app-frame");
const loader=document.getElementById("loader");

let initialized=false;

function initializeApp(){

    if(initialized) return;

    initialized=true;

    iframe.classList.add("loaded");
    loader.classList.add("fade-out");
}

iframe.addEventListener("load",initializeApp);

setTimeout(initializeApp,3000);
</script>

</body>
</html>
