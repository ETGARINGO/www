<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MY CYBER PROFILE</title>
<link rel="icon" type="image/png" href="1 LOGO 3D (1).png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg-dark: #0a0e17;
    --neon-cyan: #00f0ff;
    --neon-blue: #0077ff;
    --text-main: #e2e8f0;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* CYBER PARTICLES BACKGROUND */
  #particleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
  }

  /* FLOATING CYBER CONTROLS (Replaces Header) */
  .floating-controls {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    background: rgba(13, 20, 33, 0.85);
    backdrop-filter: blur(12px);
    padding: 8px 12px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
  }

  /* UI BUTTONS */
  .cyber-btn {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 6px 12px;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
    box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
    text-transform: uppercase;
  }

  .cyber-btn:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0,0,0,0.5);
  }

  /* VIEW CONTAINER */
  .workspace {
    position: relative;
    flex: 1;
    display: flex;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    height: 100%;
    transition: all 0.4s ease-in-out;
    position: relative;
    border-right: 1px solid rgba(0, 240, 255, 0.2);
  }

  .pane:last-child {
    border-right: none;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
  }

  /* WORLD MAP PANE */
  #mapPane {
    background: #05080f;
  }

  .map-overlay-container {
    width: 100%;
    height: 100%;
    position: relative;
  }

  @media(max-width: 900px) {
    .workspace {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

  <!-- CYBER PARTICLES BACKGROUND ENGINE -->
  <canvas id="particleCanvas"></canvas>

  <!-- FLOATING CONTROLS PANEL -->
  <div class="floating-controls">
    <button class="cyber-btn" onclick="toggleView('split')">Split</button>
    <button class="cyber-btn" onclick="toggleView('form')">Form</button>
    <button class="cyber-btn" onclick="toggleView('map')">Map</button>
    <button class="cyber-btn" onclick="toggleFullScreen()">Full Screen</button>
  </div>

  <!-- WORKSPACE PANELS -->
  <div class="workspace" id="workspace">
    <!-- FORM PANE -->
    <div class="pane" id="formPane">
      <iframe src="https://script.google.com/macros/s/AKfycbw5wBPimm2ulyNWfh-eZCCQzH4T7gabIPuKTSBbkdiVnbIKfMp5T_QVnRHaZJe-8lAJ/exec" allowfullscreen></iframe>
    </div>
    
    <!-- WORLD MAP PANE -->
    <div class="pane" id="mapPane">
      <div class="map-overlay-container">
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-180,-90,180,90&amp;layer=mapnik" style="width:100%; height:100%; filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(110%);" allowfullscreen></iframe>
      </div>
    </div>
  </div>

<script>
  /* --- CYBER PARTICLES ENGINE --- */
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  let particlesArray = [];
  const numberOfParticles = 75;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 1;
      this.speedX = (Math.random() - 0.5) * 0.8;
      this.speedY = (Math.random() - 0.5) * 0.8;
      this.color = Math.random() > 0.3 ? '#00f0ff' : '#0077ff';
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;

      if (this.x > canvas.width) this.x = 0;
      else if (this.x < 0) this.x = canvas.width;

      if (this.y > canvas.height) this.y = 0;
      else if (this.y < 0) this.y = canvas.height;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function initParticles() {
    particlesArray = [];
    for (let i = 0; i < numberOfParticles; i++) {
      particlesArray.push(new Particle());
    }
  }

  function connectParticles() {
    for (let a = 0; a < particlesArray.length; a++) {
      for (let b = a + 1; b < particlesArray.length; b++) {
        let dx = particlesArray[a].x - particlesArray[b].x;
        let dy = particlesArray[a].y - particlesArray[b].y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 120) {
          ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - distance / 120)})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
          ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
          ctx.stroke();
        }
      }
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particlesArray.length; i++) {
      particlesArray[i].update();
      particlesArray[i].draw();
    }
    connectParticles();
    requestAnimationFrame(animateParticles);
  }

  initParticles();
  animateParticles();

  /* --- INTERACTIVE CONTROLS --- */
  function toggleView(mode) {
    const formPane = document.getElementById('formPane');
    const mapPane = document.getElementById('mapPane');

    if (mode === 'split') {
      formPane.style.display = 'block';
      formPane.style.flex = '1';
      mapPane.style.display = 'block';
      mapPane.style.flex = '1';
    } else if (mode === 'form') {
      formPane.style.display = 'block';
      formPane.style.flex = '1';
      mapPane.style.display = 'none';
    } else if (mode === 'map') {
      formPane.style.display = 'none';
      mapPane.style.display = 'block';
      mapPane.style.flex = '1';
    }
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`Error attempting to enable full-screen mode: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
</script>
</body>
</html>
