<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MY CYBER PROFILE</title>
<link rel="icon" type="image/png" href="1 LOGO 3D (1).png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg-dark: #0a0e17;
    --neon-cyan: #00f0ff;
    --neon-blue: #0077ff;
    --text-main: #e2e8f0;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* CYBER PARTICLES BACKGROUND */
  #particleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
  }

  /* MOVABLE FLOATING CYBER CONTROLS */
  .floating-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    background: rgba(13, 20, 33, 0.9);
    backdrop-filter: blur(12px);
    padding: 10px 14px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 8px;
    box-shadow: 0 4px 25px rgba(0, 240, 255, 0.25);
    cursor: grab;
    touch-action: none;
  }

  .floating-controls:active {
    cursor: grabbing;
  }

  .drag-handle {
    color: var(--neon-cyan);
    font-size: 14px;
    margin-right: 2px;
    opacity: 0.7;
    letter-spacing: -2px;
  }

  /* UI BUTTONS */
  .cyber-btn {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 6px 12px;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
    box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
    text-transform: uppercase;
  }

  .cyber-btn:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0,0,0,0.5);
  }

  /* VIEW CONTAINER */
  .workspace {
    position: relative;
    flex: 1;
    display: flex;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    height: 100%;
    transition: all 0.4s ease-in-out;
    position: relative;
    border-right: 1px solid rgba(0, 240, 255, 0.2);
  }

  .pane:last-child {
    border-right: none;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
  }

  /* ANIMATED CYBER WORLD MAP PANE */
  #mapPane {
    background: #03060c;
    position: relative;
    overflow: hidden;
  }

  #cyberMapCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .map-hud-overlay {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(5, 10, 20, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 10px 15px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    color: var(--neon-cyan);
    pointer-events: none;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    z-index: 10;
  }

  @media(max-width: 900px) {
    .workspace {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

  <!-- CYBER PARTICLES BACKGROUND ENGINE -->
  <canvas id="particleCanvas"></canvas>

  <!-- MOVABLE FLOATING CONTROLS PANEL -->
  <div class="floating-controls" id="floatingControls">
    <span class="drag-handle">⠿</span>
    <button class="cyber-btn" onclick="toggleView('split')">Split</button>
    <button class="cyber-btn" onclick="toggleView('form')">Form</button>
    <button class="cyber-btn" onclick="toggleView('map')">Map</button>
    <button class="cyber-btn" onclick="toggleFullScreen()">Full Screen</button>
  </div>

  <!-- WORKSPACE PANELS -->
  <div class="workspace" id="workspace">
    <!-- FORM PANE -->
    <div class="pane" id="formPane">
      <iframe src="https://script.google.com/macros/s/AKfycbw5wBPimm2ulyNWfh-eZCCQzH4T7gabIPuKTSBbkdiVnbIKfMp5T_QVnRHaZJe-8lAJ/exec" allowfullscreen></iframe>
    </div>
    
    <!-- ANIMATED CYBER MAP PANE -->
    <div class="pane" id="mapPane">
      <canvas id="cyberMapCanvas"></canvas>
      <div class="map-hud-overlay">
        GLOBAL GRID: ACTIVE<br>
        SECURE NODE LINK: STABLE
      </div>
    </div>
  </div>

<script>
  /* --- CYBER PARTICLES ENGINE (BACKGROUND) --- */
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  let particlesArray = [];
  const numberOfParticles = 75;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 1;
      this.speedX = (Math.random() - 0.5) * 0.8;
      this.speedY = (Math.random() - 0.5) * 0.8;
      this.color = Math.random() > 0.3 ? '#00f0ff' : '#0077ff';
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;

      if (this.x > canvas.width) this.x = 0;
      else if (this.x < 0) this.x = canvas.width;

      if (this.y > canvas.height) this.y = 0;
      else if (this.y < 0) this.y = canvas.height;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function initParticles() {
    particlesArray = [];
    for (let i = 0; i < numberOfParticles; i++) {
      particlesArray.push(new Particle());
    }
  }

  function connectParticles() {
    for (let a = 0; a < particlesArray.length; a++) {
      for (let b = a + 1; b < particlesArray.length; b++) {
        let dx = particlesArray[a].x - particlesArray[b].x;
        let dy = particlesArray[a].y - particlesArray[b].y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 120) {
          ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - distance / 120)})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
          ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
          ctx.stroke();
        }
      }
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particlesArray.length; i++) {
      particlesArray[i].update();
      particlesArray[i].draw();
    }
    connectParticles();
    requestAnimationFrame(animateParticles);
  }

  initParticles();
  animateParticles();

  /* --- ANIMATED CYBER WORLD MAP ENGINE --- */
  const mapCanvas = document.getElementById('cyberMapCanvas');
  const mapCtx = mapCanvas.getContext('2d');

  function resizeMapCanvas() {
    const pane = document.getElementById('mapPane');
    mapCanvas.width = pane.clientWidth;
    mapCanvas.height = pane.clientHeight;
  }
  window.addEventListener('resize', resizeMapCanvas);
  resizeMapCanvas();

  // Abstract simulated globe nodes and active communication data streams
  const mapNodes = [
    {x: 0.2, y: 0.3, label: "NA-01"},
    {x: 0.28, y: 0.45, label: "SA-02"},
    {x: 0.48, y: 0.28, label: "EU-01"},
    {x: 0.55, y: 0.4, label: "AF-01"},
    {x: 0.72, y: 0.32, label: "AS-01"},
    {x: 0.85, y: 0.6, label: "OC-01"},
    {x: 0.38, y: 0.35, label: "AT-CORE"}
  ];

  let pulseAngle = 0;

  function animateCyberMap() {
    mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
    
    // Draw radar/grid scanning overlay lines
    mapCtx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    mapCtx.lineWidth = 1;
    let step = 40;
    for (let x = 0; x < mapCanvas.width; x += step) {
      mapCtx.beginPath(); mapCtx.moveTo(x, 0); mapCtx.lineTo(x, mapCanvas.height); mapCtx.stroke();
    }
    for (let y = 0; y < mapCanvas.height; y += step) {
      mapCtx.beginPath(); mapCtx.moveTo(0, y); mapCtx.lineTo(mapCanvas.width, y); mapCtx.stroke();
    }

    // Convert relative node coordinates to absolute pixels
    const absNodes = mapNodes.map(n => ({
      x: n.x * mapCanvas.width,
      y: n.y * mapCanvas.height,
      label: n.label
    }));

    // Draw connecting data streams
    for (let i = 0; i < absNodes.length; i++) {
      for (let j = i + 1; j < absNodes.length; j++) {
        let dist = Math.hypot(absNodes[i].x - absNodes[j].x, absNodes[i].y - absNodes[j].y);
        if (dist < mapCanvas.width * 0.4) {
          mapCtx.strokeStyle = 'rgba(0, 119, 255, 0.2)';
          mapCtx.lineWidth = 1;
          mapCtx.beginPath();
          mapCtx.moveTo(absNodes[i].x, absNodes[i].y);
          mapCtx.lineTo(absNodes[j].x, absNodes[j].y);
          mapCtx.stroke();
        }
      }
    }

    // Draw active animated data pulses traveling across pathways
    pulseAngle += 0.03;
    let currentPulse = (Math.sin(pulseAngle) + 1) / 2; // oscillates 0 to 1

    absNodes.forEach((node, idx) => {
      let targetNode = absNodes[(idx + 2) % absNodes.length];
      let px = node.x + (targetNode.x - node.x) * currentPulse;
      let py = node.y + (targetNode.y - node.y) * currentPulse;

      mapCtx.fillStyle = '#00f0ff';
      mapCtx.shadowBlur = 10;
      mapCtx.shadowColor = '#00f0ff';
      mapCtx.beginPath();
      mapCtx.arc(px, py, 2.5, 0, Math.PI * 2);
      mapCtx.fill();
      mapCtx.shadowBlur = 0;

      // Draw Node markers
      mapCtx.fillStyle = '#ffffff';
      mapCtx.beginPath();
      mapCtx.arc(node.x, node.y, 4, 0, Math.PI * 2);
      mapCtx.fill();

      // Node Pulse Effect
      mapCtx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
      mapCtx.lineWidth = 1.5;
      mapCtx.beginPath();
      let ringRadius = 6 + Math.sin(pulseAngle * 2 + idx) * 4;
      mapCtx.arc(node.x, node.y, Math.abs(ringRadius), 0, Math.PI * 2);
      mapCtx.stroke();

      // Node label
      mapCtx.fillStyle = '#00f0ff';
      mapCtx.font = '10px monospace';
      mapCtx.fillText(node.label, node.x + 10, node.y + 4);
    });

    requestAnimationFrame(animateCyberMap);
  }
  animateCyberMap();


  /* --- MOVABLE FLOATING PANEL LOGIC (DRAG & DROP) --- */
  const floatingControls = document.getElementById('floatingControls');
  let isDragging = false;
  let startX, startY, initialLeft, initialTop;

  floatingControls.addEventListener('pointerdown', (e) => {
    isDragging = true;
    floatingControls.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    
    const rect = floatingControls.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
    
    // Switch from absolute/right positioning to fixed pixel placement tracking
    floatingControls.style.right = 'auto';
    floatingControls.style.left = initialLeft + 'px';
    floatingControls.style.top = initialTop + 'px';
  });

  floatingControls.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    floatingControls.style.left = (initialLeft + dx) + 'px';
    floatingControls.style.top = (initialTop + dy) + 'px';
  });

  floatingControls.addEventListener('pointerup', (e) => {
    isDragging = false;
    floatingControls.releasePointerCapture(e.pointerId);
  });


  /* --- INTERACTIVE CONTROLS --- */
  function toggleView(mode) {
    const formPane = document.getElementById('formPane');
    const mapPane = document.getElementById('mapPane');

    if (mode === 'split') {
      formPane.style.display = 'block';
      formPane.style.flex = '1';
      mapPane.style.display = 'block';
      mapPane.style.flex = '1';
      resizeMapCanvas();
    } else if (mode === 'form') {
      formPane.style.display = 'block';
      formPane.style.flex = '1';
      mapPane.style.display = 'none';
    } else if (mode === 'map') {
      formPane.style.display = 'none';
      mapPane.style.display = 'block';
      mapPane.style.flex = '1';
      resizeMapCanvas();
    }
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`Error attempting to enable full-screen mode: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
</script>
</body>
</html>
